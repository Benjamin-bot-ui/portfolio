<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>地震資料使用者頁面</title>
  <link rel="stylesheet" href="user.css" />
</head>
<body>
  <div class="container">
  <h1>地震資料查詢</h1>

  <!-- 🔘 功能按鈕 -->
  <button id="show-all">顯示全部資料</button>
  <button id="show-latest">顯示最新資料</button>
  <button id="btn-show-stats-form">統計震央位置次數</button>
  <button id="btn-show-intensity-form">查詢縣市地震震度</button>
  <button id="btn-show-filter-form">條件篩選地震資料</button>
  </div>
  <!-- 📅 各種查詢表單 -->
  <div id="stats-form-section" style="display:none;">
    <h2>統計震央位置次數</h2>
    <form id="stats-form">
      <label>起始時間：<input type="datetime-local" id="stats-start" required></label>
      <label>結束時間：<input type="datetime-local" id="stats-end" required></label>
      <button type="submit">查詢</button>
    </form>
  </div>

  <div id="intensity-form-section" style="display:none;">
    <h2>查詢縣市地震震度</h2>
    <form id="intensity-form">
      <label>起始時間：<input type="datetime-local" id="intensity-start" required></label>
      <label>結束時間：<input type="datetime-local" id="intensity-end" required></label>
      <button type="submit">查詢</button>
    </form>
  </div>

  <div id="filter-form-section" style="display:none;">
    <h2>條件篩選地震資料</h2>
    <form id="filter-form">
      <label>起始時間：<input type="datetime-local" id="filter-start"></label>
      <label>結束時間：<input type="datetime-local" id="filter-end"></label><br>
      <label>震央位置關鍵字：<input type="text" id="filter-location" placeholder="例如：花蓮"></label><br>
      <label>最小規模：<input type="number" step="0.1" id="filter-min-mag"></label>
      <label>最大規模：<input type="number" step="0.1" id="filter-max-mag"></label><br>
      <button type="submit">查詢</button>
    </form>
  </div>

  <!-- 表頭區域 -->
  <h3 id="header-city-intensity" style="display:none;">
    <span style="display:inline-block; width:30px;"></span>
    <span style="display:inline-block; width:200px;">發生時間</span>
    <span style="display:inline-block; width:150px;">縣市名稱</span>
    <span style="display:inline-block; width:100px;">當地震度</span>
    <span style="display:inline-block; width:100px;">備註</span>
  </h3>

  <h3 id="header-stats" style="display:none;">
    <span style="display:inline-block; width:30px;"></span>
    <span style="display:inline-block; width:200px;">震央位置</span>
    <span style="display:inline-block; width:100px;">總次數</span>
  </h3>

  <h3 id="header-all" style="display:none;">
    <span style="display:inline-block; width:30px;"></span>
    <span style="display:inline-block; width:120px;">當年地震編號</span>
    <span style="display:inline-block; width:150px;">地震類型</span>
    <span style="display:inline-block; width:300px;">發生時間</span>
    <span style="display:inline-block; width:90px;">震央經度</span>
    <span style="display:inline-block; width:90px;">震央緯度</span>
    <span style="display:inline-block; width:90px;">芮氏規模</span>
    <span style="display:inline-block; width:90px;">深度</span>
    <span style="display:inline-block; width:90px;">最大震度</span>
    <span style="display:inline-block; width:90px;">震央</span>
  </h3>

  <ul id="data-list"></ul>

  <!-- JS -->
  <script>
    function hideAllHeaders() {
      document.getElementById('header-all').style.display = 'none';
      document.getElementById('header-stats').style.display = 'none';
      document.getElementById('header-city-intensity').style.display = 'none';
    }

    async function showAll() {
      hideAllHeaders();
  document.getElementById('stats-form-section').style.display = 'none';
  document.getElementById('intensity-form-section').style.display = 'none';
  document.getElementById('filter-form-section').style.display = 'none';
  document.getElementById('header-all').style.display = 'block';
  const res = await fetch('/data');
  const data = await res.json();
  renderList(data);
    }

    async function showLatest() {
      hideAllHeaders();
  document.getElementById('stats-form-section').style.display = 'none';
  document.getElementById('intensity-form-section').style.display = 'none';
  document.getElementById('filter-form-section').style.display = 'none';
  document.getElementById('header-all').style.display = 'block';
  const res = await fetch('/latest');
  const data = await res.json();
  renderList([data]);
    }

    document.getElementById('stats-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAllHeaders();
      document.getElementById('header-stats').style.display = 'block';
      const start = document.getElementById('stats-start').value;
      const end = document.getElementById('stats-end').value;
      const res = await fetch(`/stats?start=${start}&end=${end}`);
      const data = await res.json();
      const list = document.getElementById('data-list');
      list.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span style="display:inline-block; width:200px;">${item.震央位置}</span>
          <span style="display:inline-block; width:100px;">${item.總次數}</span>
        `;
        list.appendChild(li);
      });
    });

    document.getElementById('intensity-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAllHeaders();
      document.getElementById('header-city-intensity').style.display = 'block';
      const start = document.getElementById('intensity-start').value;
      const end = document.getElementById('intensity-end').value;
      const res = await fetch(`/city-intensity?start=${start}&end=${end}`);
      const data = await res.json();
      const list = document.getElementById('data-list');
      list.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span style="display:inline-block; width:200px;">${item.發生時間}</span>
          <span style="display:inline-block; width:150px;">${item.縣市名稱}</span>
          <span style="display:inline-block; width:100px;">${item.當地震度}</span>
          <span style="display:inline-block; width:100px;">${item.備註}</span>
        `;
        list.appendChild(li);
      });
    });

    document.getElementById('filter-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAllHeaders();
      document.getElementById('header-all').style.display = 'block';
      const params = new URLSearchParams();
      const start = document.getElementById('filter-start').value;
      const end = document.getElementById('filter-end').value;
      const location = document.getElementById('filter-location').value;
      const minMag = document.getElementById('filter-min-mag').value;
      const maxMag = document.getElementById('filter-max-mag').value;
      if (start) params.append('start', start);
      if (end) params.append('end', end);
      if (location) params.append('location', location);
      if (minMag) params.append('min_mag', minMag);
      if (maxMag) params.append('max_mag', maxMag);
      const res = await fetch(`/filter?${params.toString()}`);
      const data = await res.json();
      renderList(data);
    });

    function renderList(data) {
      const list = document.getElementById('data-list');
      list.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span style="display:inline-block; width:120px;">${item.當年地震編號 ?? 'null'}</span>
          <span style="display:inline-block; width:150px;">${item.地震類型}</span>
          <span style="display:inline-block; width:300px;">${item.發生時間}</span>
          <span style="display:inline-block; width:90px;">${item.震央經度}</span>
          <span style="display:inline-block; width:90px;">${item.震央緯度}</span>
          <span style="display:inline-block; width:90px;">${item.芮氏規模}</span>
          <span style="display:inline-block; width:90px;">${item.深度}</span>
          <span style="display:inline-block; width:90px;">${item.最大震度}</span>
          <span style="display:inline-block; width:90px;">${item.位置}</span>
        <hr>`;
        list.appendChild(li);
      });
    }

    document.getElementById('show-all').addEventListener('click', showAll);
    document.getElementById('show-latest').addEventListener('click', showLatest);
    document.getElementById('btn-show-stats-form').addEventListener('click', () => {
      document.getElementById('stats-form-section').style.display = 'block';
      document.getElementById('intensity-form-section').style.display = 'none';
      document.getElementById('filter-form-section').style.display = 'none';
      hideAllHeaders();
      document.getElementById('data-list').innerHTML = '';
    });
    document.getElementById('btn-show-intensity-form').addEventListener('click', () => {
      document.getElementById('stats-form-section').style.display = 'none';
      document.getElementById('intensity-form-section').style.display = 'block';
      document.getElementById('filter-form-section').style.display = 'none';
      hideAllHeaders();
      document.getElementById('data-list').innerHTML = '';
    });
    document.getElementById('btn-show-filter-form').addEventListener('click', () => {
      document.getElementById('stats-form-section').style.display = 'none';
      document.getElementById('intensity-form-section').style.display = 'none';
      document.getElementById('filter-form-section').style.display = 'block';
      hideAllHeaders();
      document.getElementById('data-list').innerHTML = '';
    });
  </script>
</body>
</html>
