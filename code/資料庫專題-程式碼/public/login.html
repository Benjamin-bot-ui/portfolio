<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>管理者登入</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div>
  <h1>管理者登入</h1>
  <form id="login-form">
    <label>帳號：<input type="text" id="username" required></label><br>
    <label>密碼：<input type="password" id="password" required></label><br>
    <button type="submit">登入</button>
  </form>
  </div>
  
  <p id="message" style="color: red;"></p>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const result = await res.json();
      if (result.success) {
        window.location.href = '/admin.html';  // 登入成功導向管理頁面
      } else {
        document.getElementById('message').textContent = '登入失敗，請檢查帳號或密碼。';
      }
    });
  </script>
</body>
</html>
